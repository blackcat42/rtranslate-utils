name: Release Windows x86

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - name: Configure Git Line Endings
        run: |
          git config --system core.autocrlf false
          git config --system core.eol lf

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-msvc
          target: i686-pc-windows-msvc

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Install dependencies on Windows
        run: |
          choco install cmake -y
          choco install strawberryperl -y
          choco install pkgconfiglite -y
          choco install llvm -y
          choco install nasm -y
        shell: cmd

      - name: Build rt_ocr on Windows x86 Debug
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --target i686-pc-windows-msvc --bin rt_ocr

      - name: Build rt_ocr on Windows x64
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --target x86_64-pc-windows-msvc --bin rt_ocr

      - name: Build wreq_cli on Windows x86 Debug
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --target i686-pc-windows-msvc --bin wreq_cli

      - name: Build wreq_cli on Windows x64
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --target x86_64-pc-windows-msvc --bin wreq_cli

      - name: Rename x64 binaries
        shell: pwsh
        run: |
          Copy-Item target/x86_64-pc-windows-msvc/release/rt_ocr.exe target/x86_64-pc-windows-msvc/release/rt_ocr_x64.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/wreq_cli.exe target/x86_64-pc-windows-msvc/release/wreq_cli_x64.exe

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/i686-pc-windows-msvc/release/rt_ocr.exe
            target/i686-pc-windows-msvc/release/wreq_cli.exe
            target/x86_64-pc-windows-msvc/release/rt_ocr_x64.exe
            target/x86_64-pc-windows-msvc/release/wreq_cli_x64.exe
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          